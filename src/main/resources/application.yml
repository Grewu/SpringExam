spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    drop-first: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: PUBLIC
    user: sa
    password:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs      
  swagger-ui:
    path: /swagger-ui.html
